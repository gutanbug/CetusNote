# 릴리스 (SYS-07): v* 태그를 올리면 macOS universal 앱을 만들어 GitHub Release에 올린다.
# 올라가는 것: .dmg · .app.tar.gz(업데이트 본체) · .sig(서명) · latest.json(앱이 읽는 업데이트 목록).
# 필요한 저장소 시크릿: TAURI_SIGNING_PRIVATE_KEY (필수), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (키 비밀번호, 없으면 빈 값으로 설정).
# Apple 서명·공증은 하지 않는다. 처음 설치하는 사람은 앱을 우클릭 › 열기로 열어야 한다.
#
# 실행 전 체크: 태그 이름과 package.json · tauri.conf.json · Cargo.toml · Cargo.lock 버전이 같아야 한다(scripts/version.mjs).
# Release는 바로 공개한다(draft 아님). 앱의 업데이트 주소가 releases/latest/download/latest.json이라,
# draft로 두면 공개 전까지 업데이트 확인이 실패한다.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: pnpm 준비
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.6.1

      - name: Node 준비
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Rust 타깃 추가 (universal 빌드용)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 태그와 버전 파일 확인
        run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

      - name: 빌드 · 서명 · Release 올리기
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cetus Note ${{ github.ref_name }}"
          releaseBody: |
            Cetus Note ${{ github.ref_name }}

            이미 설치한 앱은 설정 › 일반 › 업데이트에서 바로 업데이트할 수 있어요.
            처음 설치하는 경우 서명·공증이 없어서 앱을 우클릭 › 열기로 열어 주세요.
          releaseDraft: false
          prerelease: false
          # 릴리스 빌드에만 업데이트 산출물(.sig, latest.json 원본)을 만든다. 개발 빌드(pnpm app)에는 영향 없음
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true

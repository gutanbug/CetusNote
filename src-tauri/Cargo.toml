[package]
name = "cetusnote"
version = "0.1.7"
description = "Cetus Note — local-first note app"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cetusnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: 빠른 입력 패널(QN-03)의 투명한 둥근 모서리. App Store 배포는 하지 않는다
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
libc = "0.2"
# 폴더 선택·저장 대화상자. Rust 커맨드 안에서만 띄운다(프론트엔드 권한 없음).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 백업 zip(DATA-05). 9.x는 매일 바뀌고 있어 반년 지난 8.6을 고정. 압축은 deflate만
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# 이미지 링크 내려받기(PAGE-10 asset_fetch). 2주 지난 3.5.1을 고정. rustls(ring)
ureq = "=3.5.1"
# 붙여 넣은 웹 이미지 주소 검사(EDIT-24) — tauri가 이미 쓰는 판을 그대로
url = "=2.5.8"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
# 날짜 칩 알림(EDIT-37, ADR-025 알림 항목). 앱이 켜져 있을 때만 OS 알림을 띄운다. 2.7.0은 2026-10-14 공개, tauri ^2.12와 호환
tauri-plugin-notification = "=2.7.0"
# 로그인할 때 시작(SYS-15). 2.7.0은 2026-10-01 공개. npm 패키지 @tauri-apps/plugin-autostart와 같은 판
tauri-plugin-autostart = "=2.7.0"
# 빠른 입력 전역 단축키(QN-03). 2.4.1은 2026-10-10 공개. npm 패키지 @tauri-apps/plugin-global-shortcut과 같은 판
tauri-plugin-global-shortcut = "=2.4.1"
# PDF 내보내기(DATA-06): 메인 WKWebView의 createPDF로 쪽을 찍고 PDFKit으로 한 파일에 합친다(pdf.rs). objc2는 tauri·wry가 쓰는 판과 같다
# 개발용 빌드에서만 등록 (lib.rs의 cfg(debug_assertions)). 개발 자동화 도구가 앱에 접속하는 통로.
tauri-plugin-mcp-bridge = "0.13"

# MCP 서버(`--mcp`, DATA-12). 공식 Rust SDK. 2주 넘게 지난 3.9.0을 고정(3.11.0은 2026-11-17 공개). stdio 전송만 쓴다
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
# MCP 페이지 id(ULID) 난수. 이미 Cargo.lock에 있는 0.3.4를 그대로 쓴다
getrandom = "=0.3.4"
# MCP 모드에서 앱 설정 폴더(app-state.json)를 찾는다. tauri가 이미 쓰는 7.0.0과 같다
dirs = "=7.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-web-kit = { version = "=0.3.2", features = ["std", "WKWebView", "WKPDFConfiguration", "block2", "objc2-app-kit"] }
objc2-pdf-kit = { version = "=0.3.2", features = ["std", "PDFDocument", "PDFPage", "objc2-app-kit"] }
# 미리보기 쪽 그림(PNG, DATA-06): PDFKit 썸네일을 비트맵으로 바꾼다. objc2-web-kit이 쓰는 판과 같다
objc2-app-kit = { version = "=0.3.2", features = ["std", "NSApplication", "NSImage", "NSBitmapImageRep", "NSWindow", "NSEvent", "block2"] }
block2 = "=0.6.2"
# 빠른 입력 창을 비활성 NSPanel로 바꾼다(QN-03): 앱을 활성화하지 않고 떠서 메인 창이 앞으로 나오지 않는다. 2.1.1은 tauri ^2.8 · objc2 0.6 · objc2-app-kit 0.3을 쓴다(잠긴 판과 호환)
tauri-nspanel = "=2.1.1"

# Windows PDF 내보내기(DATA-06·SYS-08): WebView2 PrintToPdf. wry·tauri가 쓰는 판과 같다
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
# 잠금(DATA-03): 프로세스 생존·시작 시각 확인
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Linux PDF 내보내기(DATA-06·SYS-08): WebKitGTK 인쇄 작업을 파일 PDF로. wry·tauri가 쓰는 판과 같다
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
gtk = "=0.18.2"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# thin LTO와 기본 codegen-units: 릴리스 빌드 시간을 줄인다(full LTO + codegen-units=1보다 조금 덜 최적화됨).
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# 저장 커맨드 묶음 (src/commands.rs). capabilities/default.json에서 메인 창에만 준다.
[[set]]
identifier = "storage"
description = "워크스페이스 만들기·전환·페이지·앱 설정 읽기/쓰기, 앱 아이콘 바꾸기, 폴더 선택, Markdown 내보내기(페이지·워크스페이스 전체)·가져오기(파일 고르기·상대 경로 이미지), 이미지 저장·읽기·선택·링크 내려받기, 파일 첨부(고르기·끌어 놓기·열기·Finder에서 보기·다른 이름으로 저장·미리보기 경로), 백업·복원, 인쇄(PDF)·미리보기 쪽 그림, 외부 변경 감지, 페이지 버전 기록"
permissions = [
  "allow-workspace-current",
  "allow-workspace-pick",
  "allow-workspace-use-default",
  "allow-workspace-recent",
  "allow-workspace-switch",
  "allow-workspace-forget",
  "allow-workspace-create",
  "allow-workspace-read",
  "allow-workspace-write",
  "allow-pages-load-all",
  "allow-app-executable-path",
  "allow-pages-load-meta",
  "allow-page-write",
  "allow-page-purge",
  "allow-history-save",
  "allow-history-list",
  "allow-history-read",
  "allow-history-delete",
  "allow-settings-read",
  "allow-settings-write",
  "allow-app-icon-set",
  "allow-export-markdown",
  "allow-export-csv",
  "allow-workspace-export-markdown",
  "allow-workspace-export-reveal",
  "allow-asset-write",
  "allow-asset-read",
  "allow-asset-pick",
  "allow-asset-fetch",
  "allow-asset-pick-file",
  "allow-asset-import-file",
  "allow-asset-import-bytes",
  "allow-asset-reveal",
  "allow-asset-open",
  "allow-asset-save-as",
  "allow-asset-src-path",
  "allow-backup-export",
  "allow-backup-auto",
  "allow-backup-list",
  "allow-backup-reveal",
  "allow-backup-restore",
  "allow-pdf-page",
  "allow-pdf-finish",
  "allow-pdf-preview-page",
  "allow-pdf-print-document",
  "allow-pdf-export-bytes",
  "allow-pdf-save",
  "allow-workspace-scan",
  "allow-pages-read",
  "allow-document-pick",
  "allow-document-bytes",
  "allow-document-pdf-text",
  "allow-document-image",
  "allow-app-import-pick",
  "allow-app-import-bytes",
  "allow-app-import-enex-pick",
  "allow-app-import-enex-read",
  "allow-confirm-quit",
]

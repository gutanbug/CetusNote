# 빠른 입력 창(quick)에 준다: 빠른 메모 저장·검색에 필요한 커맨드만 (최소 권한)
[[set]]
identifier = "quick"
description = "빠른 입력 창: 현재 워크스페이스 확인, 빠른 메모(워크스페이스 메타)·페이지 목록(메타)·쓰기, 알림 파일 읽기·쓰기"
permissions = [
  "allow-workspace-current",
  "allow-workspace-read",
  "allow-workspace-write",
  "allow-pages-load-meta",
  "allow-page-write",
  "allow-reminders-read",
  "allow-reminders-write",
  "allow-quick-note-append",
  "allow-main-window-show",
]
